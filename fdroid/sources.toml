version = 1

# APKs built and published by this repository. These are trusted through the
# repository's own release workflow and package-signing identity.
[[source]]
name = "patched-kushion"
repository = "@self"
asset-patterns = ["*.apk"]
release-limit = 10
include-prereleases = false
allow-unpinned = true

# Official sing-box for Android release APK. Keep the normal universal build;
# upstream also publishes Android 5 legacy APKs under the same package name.
[[source]]
name = "sing-box"
repository = "SagerNet/sing-box"
asset-patterns = ["SFA-*-universal.apk"]
asset-exclude-patterns = ["*-legacy-*"]
release-limit = 5
include-prereleases = false

[source.package-certificates]
"io.nekohasekai.sfa" = ["32250A4B5F3A6733DF57A3B9EC16C38D2C7FC5F2F693A9636F8F7B3BE3549641"]
