config-version = 1

# Defaults shared by every locally patched app. Per-app [apps.<name>.build]
# tables only override values that differ.
[build]
enable-module-update = true
parallel-jobs = 1
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-desktop"
patch-brand = "Morphe"
publish-consistency = "target"
forward-compatibility-probes = 2
enable-aptoide = true
enable-apkpure = true

# Stock artifacts from mirrors are treated as untrusted transport. These IoCs
# are hard quarantine rules; signer pins remain the primary trust boundary.
[stock-security]
cross-source-verification = "opportunistic"
deny-sha256 = [
  "7d44e0009d251ae4983f5bf29f7d8aa9af668df88dba05a17a7a314f6780ceff",
]
deny-indicators = ["38.190.225.166"]

# Patched apps. package-name is the stable non-root distribution identity;
# upstream-package is the package used to resolve and verify stock APKs.
[apps.KouTube]
display-name = "KouTube"
package-name = "de.kwoo.shion.youtube"
upstream-package = "com.google.android.youtube"

[apps.KouTube.build]
launcher-name = "KouTube"
build-mode = "both"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"

[apps.KouMusik]
display-name = "KouMusik"
package-name = "de.kwoo.shion.music"
upstream-package = "com.google.android.apps.youtube.music"

[apps.KouMusik.build]
launcher-name = "KouMusik"
build-mode = "both"
arches = ["arm64-v8a"]
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"

[apps.KouInstagram]
display-name = "KouInstagram"
package-name = "de.kwoo.shion.instagram"
upstream-package = "com.instagram.android"

[apps.KouInstagram.build]
launcher-name = "KouInstagram"
patches-source = "crimera/piko"
patch-brand = "Piko"
build-mode = "both"
arches = ["arm64-v8a"]
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
uptodown-dlurl = "https://instagram.en.uptodown.com/android"
apkfab-dlurl = "https://apkfab.com/instagram/com.instagram.android"

[apps.KouMessenger]
display-name = "KouMessenger"
package-name = "de.kwoo.shion.messenger"
upstream-package = "com.facebook.orca"

[apps.KouMessenger.build]
launcher-name = "KouMessenger"
patches-source = "RookieEnough/De-Vanced"
patch-brand = "De-Vanced"
build-mode = "both"
arch = "both"
apkmirror-dlurl = "https://www.apkmirror.com/apk/facebook-2/messenger"
uptodown-dlurl = "https://facebook-messenger.en.uptodown.com/android"

[apps.KouPhotos]
display-name = "KouPhotos"
package-name = "de.kwoo.shion.photos"
upstream-package = "com.google.android.apps.photos"

[apps.KouPhotos.build]
launcher-name = "KouPhotos"
patches-source = "RookieEnough/De-Vanced"
patch-brand = "De-Vanced"
build-mode = "both"
included-patches = """\
  'Override certificate pinning' \
  'Enable DCIM folders backup control' \
  'Fix selected account persistence' \
  'Spoof features' \
  """
exclusive-patches = true
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/photos/"
uptodown-dlurl = "https://google-photos.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.photos"

# External release apps. These APKs keep their upstream package identity and
# signature; patched-kushion only verifies and mirrors selected release assets.
[apps.sing-box]
display-name = "sing-box for Android"
package-name = "io.nekohasekai.sfa"

[apps.sing-box.release]
repository = "SagerNet/sing-box"
asset-patterns = [
  "SFA-*-arm64-v8a.apk",
  "SFA-*-armeabi-v7a.apk",
  "SFA-*-x86.apk",
  "SFA-*-x86_64.apk",
  "SFA-*-universal.apk",
]
asset-exclude-patterns = ["*-legacy-*"]
release-limit = 5
include-prereleases = true
certificates = ["32250A4B5F3A6733DF57A3B9EC16C38D2C7FC5F2F693A9636F8F7B3BE3549641"]

[apps.sing-box.release.asset-native-codes]
"SFA-*-arm64-v8a.apk" = ["arm64-v8a"]
"SFA-*-armeabi-v7a.apk" = ["armeabi-v7a"]
"SFA-*-x86.apk" = ["x86"]
"SFA-*-x86_64.apk" = ["x86_64"]
"SFA-*-universal.apk" = ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]

[apps.MicroG-RE]
display-name = "MicroG RE"
package-name = "app.revanced.android.gms"

[apps.MicroG-RE.release]
repository = "MorpheApp/MicroG-RE"
asset-patterns = ["microg-*.apk"]
release-limit = 5
include-prereleases = false
certificates = ["0B6C9515AFB195FAC59601696BA0A7907A0B217CCF720B43148427CCF64343E7"]

# Accepted signing certificates for stock APKs used by local patch builds.
# Digests are SHA-256 without separators.
[upstream-signatures]
"com.facebook.orca" = ["e3f9e1e0cf99d0e56a055ba65e241b3399f7cea524326b0cdd6ec1327ed0fdc1"]
"com.instagram.android" = ["5f3e50f435583c9ae626302a71f7340044087a7e2c60adacfc254205a993e305"]
"com.google.android.apps.photos" = ["3d7a1223019aa39d9ea0e3436ab7c0896bfb4fb679f4de5fe7c23f326c8f994a"]
"com.google.android.apps.youtube.music" = ["a2a1ad7ba7f41dfca4514e2afeb90691719af6d0fdbed4b09bbf0ed897701ceb"]
"com.google.android.youtube" = ["3d7a1223019aa39d9ea0e3436ab7c0896bfb4fb679f4de5fe7c23f326c8f994a"]
"com.reddit.frontpage" = ["970b91143813b4c9d5f3634f672c9fcaa5621b4efaaedafd6c235cbbb869736f"]
"tv.twitch.android.app" = ["1338f9b049893cc70b78432a177582f90bd4bc6296ea4ed35bcc7df59687ac53"]

# Repository-wide F-Droid policy. Patched APKs are imported from this repo's
# own Releases; external release definitions live with their apps above.
[fdroid]
max-repo-asset-size = 104857600
include-built-releases = true
built-release-limit = 10
