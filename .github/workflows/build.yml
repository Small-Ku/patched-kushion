name: Build one variant

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      arch:
        required: true
        type: string
      mode:
        required: true
        type: string
      variant_key:
        required: true
        type: string
      input_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Restore APK package-signing identity
        env:
          APK_PATCHER_KEYSTORE_B64: ${{ secrets.APK_PATCHER_KEYSTORE_B64 }}
          APK_APKSIGNER_KEYSTORE_B64: ${{ secrets.APK_APKSIGNER_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APK_PATCHER_KEYSTORE_B64:?Set APK_PATCHER_KEYSTORE_B64}"
          : "${APK_APKSIGNER_KEYSTORE_B64:?Set APK_APKSIGNER_KEYSTORE_B64}"
          mkdir -p signing
          printf '%s' "$APK_PATCHER_KEYSTORE_B64" | base64 --decode > signing/package.keystore
          printf '%s' "$APK_APKSIGNER_KEYSTORE_B64" | base64 --decode > signing/package.p12
          chmod 600 signing/package.keystore signing/package.p12

      - name: Build atomic variant
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ inputs.release_tag }}
          BUILD_TARGET: ${{ inputs.target }}
          BUILD_ARCH: ${{ inputs.arch }}
          BUILD_MODE: ${{ inputs.mode }}
          APK_PATCHER_KEYSTORE: signing/package.keystore
          APK_APKSIGNER_KEYSTORE: signing/package.p12
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_SIGNER_NAME: ${{ secrets.APK_SIGNER_NAME }}
        run: ./build.sh config.toml

      - name: Capture verified output
        run: |
          scripts/write-build-result.py \
            --key '${{ inputs.variant_key }}' \
            --input-id '${{ inputs.input_id }}' \
            --target '${{ inputs.target }}' \
            --arch '${{ inputs.arch }}' \
            --mode '${{ inputs.mode }}' \
            --output-dir atomic-result

      - name: Remove signing identity
        if: always()
        run: rm -rf signing

      - name: Upload atomic result
        uses: actions/upload-artifact@v4
        with:
          name: atomic-${{ inputs.variant_key }}
          path: atomic-result/
          if-no-files-found: error
          retention-days: 2
