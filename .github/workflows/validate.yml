name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install identity-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libbcprov-java

      - name: Validate shell scripts and signing isolation
        env:
          BCPROV_JAR: /usr/share/java/bcprov.jar
        run: |
          bash -n build.sh utils.sh scripts/generate-package-identity.sh scripts/add-fdroid-source.sh scripts/sync-fdroid-releases.sh tests/*.sh
          python3 -m py_compile scripts/fdroid_sources.py
          tests/no-signing-secrets-test.sh
          tests/package-signing-test.sh
          tests/fdroid-sync-test.sh
          tests/fdroid-add-source-test.sh

      - name: Validate TOML configuration
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import tomllib

          config = tomllib.loads(pathlib.Path("config.toml").read_text())
          sources = tomllib.loads(pathlib.Path("fdroid/sources.toml").read_text())
          requirements = [
              line.strip()
              for line in pathlib.Path("fdroid/requirements.txt").read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          assert sources["version"] == 1
          assert sources["source"][0]["repository"] == "@self"
          assert len(requirements) == 1
          assert re.fullmatch(r"fdroidserver==\d+\.\d+\.\d+", requirements[0])
          photos = config["GooglePhotos-DeVanced"]
          assert photos["patches-source"] == "RookieEnough/De-Vanced"
          assert photos["cli-source"] == "MorpheApp/morphe-cli"
          assert photos["build-mode"] == "both"
          PY
