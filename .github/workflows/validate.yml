name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scripts-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install identity-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libbcprov-java

      - name: Validate shell scripts and signing isolation
        env:
          BCPROV_JAR: /usr/share/java/bcprov.jar
        run: |
          bash -n build.sh utils.sh scripts/generate-package-identity.sh scripts/add-fdroid-source.sh scripts/sync-fdroid-releases.sh tests/*.sh
          python3 -m py_compile scripts/fdroid_sources.py scripts/app_catalog.py
          tests/no-signing-secrets-test.sh
          tests/package-signing-test.sh
          tests/app-identities-test.sh
          tests/fdroid-sync-test.sh
          tests/fdroid-add-source-test.sh

      - name: Validate TOML configuration
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import tomllib

          config = tomllib.loads(pathlib.Path("config.toml").read_text())
          identities = tomllib.loads(pathlib.Path("package-identities.toml").read_text())
          sources = tomllib.loads(pathlib.Path("fdroid/sources.toml").read_text())
          requirements = [
              line.strip()
              for line in pathlib.Path("fdroid/requirements.txt").read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          uv_config = tomllib.loads(pathlib.Path("fdroid/uv.toml").read_text())
          fdroid_workflow = pathlib.Path(".github/workflows/fdroid.yml").read_text()
          pipeline_workflow = pathlib.Path(".github/workflows/pipeline.yml").read_text()
          build_workflow = pathlib.Path(".github/workflows/build.yml").read_text()

          assert sources["version"] == 1
          assert sources["source"][0]["repository"] == "@self"
          assert identities["version"] == 1
          assert identities["apps"]["YouTube"]["package-name"] == "de.kwoo.shion.youtube"
          assert identities["apps"]["Music"]["package-name"] == "de.kwoo.shion.music"
          assert identities["apps"]["GooglePhotos"]["package-name"] == "de.kwoo.shion.photos"
          assert identities["apps"]["GooglePhotos"]["target"] == "GooglePhotos-DeVanced"
          assert identities["apps"]["Reddit"]["package-name"] == "de.kwoo.shion.reddit"
          assert identities["apps"]["Reddit"]["target"] == "Reddit-Morphe"
          assert len(requirements) == 1
          requirement = re.fullmatch(
              r"fdroidserver @ https://files\.pythonhosted\.org/packages/[^ ]+/"
              r"fdroidserver-(\d+\.\d+\.\d+)\.tar\.gz#sha256=([0-9a-f]{64})",
              requirements[0],
          )
          assert requirement
          assert requirement.group(1) == "2.4.5"
          assert requirement.group(2) == "f9b52646264c732678e32e37e23a995db20cc61d45622dda5830ce23255547f4"
          assert uv_config["required-version"] == "==0.12.2"
          assert uv_config["python-preference"] == "managed"
          assert "actions/setup-python" not in fdroid_workflow
          assert "astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9" in fdroid_workflow
          assert 'python-version: "3.12.13"' in fdroid_workflow
          assert "uv pip install --requirement fdroid/requirements.txt" in fdroid_workflow
          assert "write-metadata" in fdroid_workflow
          assert "release:" not in fdroid_workflow
          assert "schedule:" not in fdroid_workflow
          assert "uses: ./.github/workflows/build.yml" in pipeline_workflow
          assert "uses: ./.github/workflows/fdroid.yml" in pipeline_workflow
          assert "write-all" not in pipeline_workflow
          assert "write-all" not in build_workflow
          photos = config["GooglePhotos-DeVanced"]
          assert photos["patches-source"] == "RookieEnough/De-Vanced"
          assert photos["cli-source"] == "MorpheApp/morphe-cli"
          assert photos["build-mode"] == "both"
          PY
