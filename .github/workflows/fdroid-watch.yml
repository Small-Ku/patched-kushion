name: Check F-Droid Apps

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

concurrency:
  group: fdroid-app-watch
  cancel-in-progress: true

jobs:
  check:
    name: Check Apps
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check Out Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Load F-Droid State
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          provenance="$RUNNER_TEMP/fdroid-provenance.json"
          if git fetch --no-tags --depth=1 origin fdroid \
            && git show FETCH_HEAD:fdroid/provenance.json > "$provenance"; then
            echo "Loaded provenance from the fdroid branch"
          else
            rm -f "$provenance"
            echo "No fdroid provenance is published yet"
          fi
          echo "path=$provenance" >> "$GITHUB_OUTPUT"

      - name: Check F-Droid Apps
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/fdroid-check.log"
          python3 scripts/fdroid_sources.py check \
            --config config.toml \
            --provenance "${{ steps.provenance.outputs.path }}" | tee "$log"
          changed=$(sed -n 's/^changed=\([01]\)$/\1/p' "$log" | tail -n 1)
          case "$changed" in
            0|1) echo "changed=$changed" >> "$GITHUB_OUTPUT" ;;
            *) echo "Source check did not return a valid changed state" >&2; exit 1 ;;
          esac

  publish:
    name: Publish F-Droid
    needs: check
    if: needs.check.outputs.changed == '1'
    permissions:
      contents: write
    uses: ./.github/workflows/fdroid.yml
    secrets: inherit
