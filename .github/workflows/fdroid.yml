name: Publish F-Droid

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: fdroid-repository
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish Repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check Out Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v9.0.0
        with:
          version-file: fdroid/uv.toml
          python-version: "3.12.13"
          activate-environment: true
          no-project: true
          venv-path: ${{ runner.temp }}/fdroid-venv
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            fdroid/uv.toml
            fdroid/requirements.txt

      - name: Install F-Droid Tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends aapt apksigner libmagic1
          uv pip install --requirement fdroid/requirements.txt
          python --version
          fdroid --version

      - name: Prepare F-Droid Branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/fdroid-site"
          if git ls-remote --exit-code --heads origin fdroid >/dev/null 2>&1; then
            git fetch origin fdroid
            git worktree add --detach "$site" origin/fdroid
            git -C "$site" switch -C fdroid
          else
            git worktree add --detach "$site" HEAD
            git -C "$site" switch --orphan fdroid
            git -C "$site" rm -rf . || true
          fi
          mkdir -p "$site/fdroid/repo"
          echo "site=$site" >> "$GITHUB_OUTPUT"

      - name: Load F-Droid Signing Identity
        env:
          CONFIG_YML: ${{ secrets.CONFIG_YML }}
          KEYSTORE_P12: ${{ secrets.KEYSTORE_P12 }}
        run: |
          set -euo pipefail
          if [ -z "${CONFIG_YML:-}" ] || [ -z "${KEYSTORE_P12:-}" ]; then
            echo >&2 "F-Droid signing identity is not configured."
            echo >&2 "Run ./scripts/generate-fdroid-identity.sh locally, then set"
            echo >&2 "CONFIG_YML and KEYSTORE_P12 from fdroid-signing/github-actions-secrets.env."
            exit 1
          fi
          site="${{ steps.branch.outputs.site }}"
          printf '%s' "$CONFIG_YML" | base64 --decode > "$site/fdroid/config.yml"
          printf '%s' "$KEYSTORE_P12" | base64 --decode > "$site/fdroid/keystore.p12"
          chmod 600 "$site/fdroid/config.yml" "$site/fdroid/keystore.p12"

      - name: Sync APK Sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTERNAL_RELEASE_TOKEN: ${{ secrets.EXTERNAL_RELEASE_TOKEN }}
        run: |
          scripts/sync-fdroid-releases.sh \
            "${{ steps.branch.outputs.site }}/fdroid/repo" \
            "${{ steps.branch.outputs.site }}/fdroid/provenance.json"

      - name: Create Signed Indexes
        working-directory: ${{ steps.branch.outputs.site }}/fdroid
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          rm -rf metadata
          mkdir -p metadata
          python "$GITHUB_WORKSPACE/scripts/app_catalog.py" \
            --identities "$GITHUB_WORKSPACE/package-identities.toml" \
            --config "$GITHUB_WORKSPACE/config.toml" \
            write-metadata \
            --metadata-dir metadata \
            --repository "$SOURCE_REPOSITORY"
          python "$GITHUB_WORKSPACE/scripts/fdroid_sources.py" metadata \
            --config "$GITHUB_WORKSPACE/fdroid/sources.toml" \
            --provenance provenance.json \
            --metadata-dir metadata
          mkdir -p config
          cp "$GITHUB_WORKSPACE/fdroid/releaseChannels.yml" config/releaseChannels.yml
          fdroid update --clean --create-metadata --delete-unknown --pretty --use-date-from-apk
          python "$GITHUB_WORKSPACE/scripts/fdroid_sources.py" verify-index \
            --provenance provenance.json \
            --index-v2 repo/index-v2.json

      - name: Verify Repository
        id: verify
        run: |
          set -euo pipefail
          repo="${{ steps.branch.outputs.site }}/fdroid/repo"
          test -s "$repo/index-v1.jar"
          test -s "$repo/index-v2.json"
          test -s "${{ steps.branch.outputs.site }}/fdroid/provenance.json"
          find "$repo" -maxdepth 1 -type f -name '*.apk' | grep -q .

          fingerprint=$(
            keytool -printcert -jarfile "$repo/index-v1.jar" \
              | sed -n 's/^[[:space:]]*SHA256: //p' \
              | head -1 \
              | tr -d ':'
          )
          if [[ ! $fingerprint =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo >&2 "Could not read the F-Droid repository signing fingerprint"
            exit 1
          fi
          echo "fingerprint=${fingerprint^^}" >> "$GITHUB_OUTPUT"

      - name: Publish F-Droid Branch
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          site="${{ steps.branch.outputs.site }}"
          rm -f "$site/fdroid/config.yml" "$site/fdroid/keystore.p12"
          cat > "$site/README.md" <<README
          # patched-kushion F-Droid repository

          Add this signed repository to an F-Droid-compatible client:

          https://raw.githubusercontent.com/${REPOSITORY}/fdroid/fdroid/repo?fingerprint=${{ steps.verify.outputs.fingerprint }}

          APK provenance:

          https://raw.githubusercontent.com/${REPOSITORY}/fdroid/fdroid/provenance.json

          The fingerprint above is extracted from the signed index generated in
          the same publication run. Repository setup and trust-model details are
          documented on the main branch.
          README
          touch "$site/.nojekyll"

          git -C "$site" config user.name "github-actions[bot]"
          git -C "$site" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$site" add --all
          if git -C "$site" diff --cached --quiet; then
            echo "F-Droid repository is already current"
            exit 0
          fi
          git -C "$site" commit -m "Update F-Droid repository"
          git -C "$site" push origin HEAD:fdroid
