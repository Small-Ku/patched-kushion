name: Publish F-Droid

on:
  workflow_call:
    inputs:
      publication_artifact:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      publication_artifact:
        description: Optional current-run publication handoff artifact
        required: false
        type: string
        default: ""

concurrency:
  group: fdroid-repository
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish Repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check Out Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download Current Release Publication Handoff
        if: inputs.publication_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.publication_artifact }}
          path: ${{ runner.temp }}/release-publication

      - name: Set Up Locked Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          android-tools: "true"

      - name: Verify F-Droid Tools
        shell: bash
        run: |
          set -euo pipefail
          python --version
          fdroid --version
          python -c 'import puremagic; print("puremagic:", puremagic.__file__)'
          for tool in aapt aapt2 apksigner zipalign; do
            resolved=$(command -v "$tool")
            expected="$ANDROID_BUILD_TOOLS_DIR/$tool"
            if [ "$(readlink -f "$resolved")" != "$(readlink -f "$expected")" ]; then
              echo >&2 "$tool resolved outside the selected Android Build Tools directory: $resolved"
              exit 1
            fi
          done
          aapt version
          aapt2 version
          apksigner version

      - name: Prepare F-Droid Branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/fdroid-site"
          if git ls-remote --exit-code --heads origin fdroid >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin fdroid
            git worktree add --detach "$site" FETCH_HEAD
            git -C "$site" switch -C fdroid
          else
            git worktree add --detach "$site" HEAD
            git -C "$site" switch --orphan fdroid
            git -C "$site" rm -rf . || true
          fi
          mkdir -p "$site/fdroid/repo"
          echo "site=$site" >> "$GITHUB_OUTPUT"

      - name: Snapshot F-Droid Provenance
        shell: bash
        run: |
          set -euo pipefail
          provenance="${{ steps.branch.outputs.site }}/fdroid/provenance.json"
          if [ -s "$provenance" ]; then
            cp "$provenance" "$RUNNER_TEMP/fdroid-provenance-before.json"
          fi

      - name: Load F-Droid Signing Identity
        env:
          CONFIG_YML: ${{ secrets.CONFIG_YML }}
          KEYSTORE_P12: ${{ secrets.KEYSTORE_P12 }}
        run: |
          set -euo pipefail
          if [ -z "${CONFIG_YML:-}" ] || [ -z "${KEYSTORE_P12:-}" ]; then
            echo >&2 "F-Droid signing identity is not configured."
            echo >&2 "Run ./scripts/generate-fdroid-identity.sh locally, then set"
            echo >&2 "CONFIG_YML and KEYSTORE_P12 from signing/fdroid/github-actions-secrets.env."
            exit 1
          fi
          site="${{ steps.branch.outputs.site }}"
          printf '%s' "$CONFIG_YML" | base64 --decode > "$site/fdroid/config.yml"
          printf '%s' "$KEYSTORE_P12" | base64 --decode > "$site/fdroid/keystore.p12"
          chmod 600 "$site/fdroid/config.yml" "$site/fdroid/keystore.p12"

      - name: Sync APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTERNAL_RELEASE_TOKEN: ${{ secrets.EXTERNAL_RELEASE_TOKEN }}
          PUBLICATION_ARTIFACT: ${{ inputs.publication_artifact }}
        run: |
          set -euo pipefail
          args=(
            "${{ steps.branch.outputs.site }}/fdroid/repo"
            "${{ steps.branch.outputs.site }}/fdroid/provenance.json"
          )
          if [ -n "$PUBLICATION_ARTIFACT" ]; then
            publication="$RUNNER_TEMP/release-publication/published-assets.json"
            test -s "$publication"
            args+=("$publication")
          fi
          scripts/sync-fdroid-releases.sh "${args[@]}"

      - name: Summarize F-Droid Changes
        shell: bash
        run: |
          set -euo pipefail
          args=(
            fdroid
            --after "${{ steps.branch.outputs.site }}/fdroid/provenance.json"
            --json "$RUNNER_TEMP/fdroid-summary.json"
          )
          if [ -s "$RUNNER_TEMP/fdroid-provenance-before.json" ]; then
            args+=(--before "$RUNNER_TEMP/fdroid-provenance-before.json")
          fi
          python scripts/ci_summary.py "${args[@]}"

      - name: Create Signed Indexes
        working-directory: ${{ steps.branch.outputs.site }}/fdroid
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          rm -rf metadata
          mkdir -p metadata
          python "$GITHUB_WORKSPACE/scripts/app_catalog.py" \
            --config "$GITHUB_WORKSPACE/config.toml" \
            write-metadata \
            --metadata-dir metadata \
            --repository "$SOURCE_REPOSITORY"
          python "$GITHUB_WORKSPACE/scripts/fdroid_sources.py" metadata \
            --config "$GITHUB_WORKSPACE/config.toml" \
            --provenance provenance.json \
            --metadata-dir metadata
          mkdir -p config
          cp "$GITHUB_WORKSPACE/fdroid/releaseChannels.yml" config/releaseChannels.yml
          fdroid update --clean --create-metadata --delete-unknown --pretty --use-date-from-apk
          python "$GITHUB_WORKSPACE/scripts/fdroid_sources.py" verify-index \
            --provenance provenance.json \
            --index-v1 repo/index-v1.jar \
            --index-v2 repo/index-v2.json

      - name: Verify Repository
        id: verify
        run: |
          set -euo pipefail
          repo="${{ steps.branch.outputs.site }}/fdroid/repo"
          test -s "$repo/index-v1.jar"
          test -s "$repo/index-v2.json"
          test -s "${{ steps.branch.outputs.site }}/fdroid/provenance.json"
          find "$repo" -maxdepth 1 -type f -name '*.apk' | grep -q .

          while IFS= read -r -d '' apk; do
            apksigner verify --verbose --print-certs "$apk" >/dev/null
            package=$(aapt dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
            if [[ $package == de.kwoo.shion.* ]]; then
              zipalign -c -P 16 4 "$apk"
            else
              zipalign -c 4 "$apk"
            fi
          done < <(find "$repo" -maxdepth 1 -type f -name '*.apk' -print0)

          fingerprint=$(
            keytool -printcert -jarfile "$repo/index-v1.jar" \
              | sed -n 's/^[[:space:]]*SHA256: //p' \
              | head -1 \
              | tr -d ':'
          )
          if [[ ! $fingerprint =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo >&2 "Could not read the F-Droid repository signing fingerprint"
            exit 1
          fi
          echo "fingerprint=${fingerprint^^}" >> "$GITHUB_OUTPUT"

      - name: Publish F-Droid Branch
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          site="${{ steps.branch.outputs.site }}"
          rm -f "$site/fdroid/config.yml" "$site/fdroid/keystore.p12"
          cat > "$site/README.md" <<README
          # patched-kushion F-Droid repository

          Add this signed repository to an F-Droid-compatible client:

          https://raw.githubusercontent.com/${REPOSITORY}/fdroid/fdroid/repo?fingerprint=${{ steps.verify.outputs.fingerprint }}

          APK provenance:

          https://raw.githubusercontent.com/${REPOSITORY}/fdroid/fdroid/provenance.json

          The fingerprint above is extracted from the signed index generated in
          the same publication run. Repository setup and trust-model details are
          documented on the main branch.
          README
          touch "$site/.nojekyll"

          python "$GITHUB_WORKSPACE/scripts/fdroid_sources.py" verify-publish-size \
            --config "$GITHUB_WORKSPACE/config.toml" \
            --root "$site"

          git -C "$site" config user.name "github-actions[bot]"
          git -C "$site" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$site" add --all
          if git -C "$site" diff --cached --quiet; then
            echo "F-Droid repository is already current"
            exit 0
          fi
          git -C "$site" commit -m "Update F-Droid repository"
          git -C "$site" push origin HEAD:fdroid

      - name: Upload F-Droid Publication Summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-publication-summary
          path: ${{ runner.temp }}/fdroid-summary.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
