name: Build Architecture

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      arch:
        required: true
        type: string
      version:
        required: true
        type: string
      source_strategy:
        required: true
        type: string
      branch_key:
        required: true
        type: string
      variants:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      optional:
        required: false
        type: boolean
        default: false
      source_key:
        required: true
        type: string
      source_cache_key:
        required: true
        type: string
      stock_policy_hash:
        required: true
        type: string
      force_build:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stock:
    name: Stock / ${{ inputs.target }} / ${{ inputs.arch }}
    runs-on: ubuntu-24.04
    env:
      PATCHED_KUSHION_CACHE_DIR: ${{ github.workspace }}/.patched-kushion-cache
    steps:
      - name: Check Out Source
        uses: actions/checkout@v6

      - name: Check Whether Stock Is Needed
        id: stock_need
        env:
          VARIANTS_JSON: ${{ inputs.variants }}
          SELECTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          needed=$(jq -r 'any(.[]; (.reuse.inputId // "") != (.inputId // ""))' <<<"$VARIANTS_JSON")
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Restore Prepared Stock Cache
        id: stock_cache
        if: steps.stock_need.outputs.needed == 'true'
        uses: actions/cache/restore@v6
        with:
          path: stock-result
          key: patched-kushion-stock-v2-${{ inputs.branch_key }}-${{ inputs.source_cache_key }}-${{ inputs.stock_policy_hash }}-${{ hashFiles('build.sh', 'utils.sh', 'scripts/stock_bundle.py', 'scripts/stock_fingerprint.py') }}

      - name: Validate Prepared Stock Cache
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit == 'true'
        shell: bash
        run: scripts/cache_handoff.py stock --root stock-result --target '${{ inputs.target }}' --version '${{ inputs.version }}' --arch '${{ inputs.arch }}'

      - name: Set Up Locked Toolchain
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-toolchain

      - name: Restore Verified Helper Cache
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.PATCHED_KUSHION_CACHE_DIR }}/tools
          key: patched-kushion-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('utils.sh') }}
          restore-keys: |
            patched-kushion-tools-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Select Android Build Tools
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit != 'true'
        shell: bash
        run: pixi run android-tools

      - name: Download Shared Source Metadata
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: source-${{ inputs.source_key }}-meta
          path: stock-source

      - name: Detect Shared Source
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit != 'true'
        id: shared
        env:
          BUILD_ARCH: ${{ inputs.arch }}
        shell: bash
        run: |
          echo "available=$(jq -r '.shared == true' stock-source/source.json)" >> "$GITHUB_OUTPUT"
          for arch in universal arm64-v8a arm-v7a x86_64 x86; do
            key=${arch//-/_}
            echo "has_${key}=$(jq -r --arg arch "$arch" '(.availableBuildArches // []) | index($arch) != null' stock-source/source.json)" >> "$GITHUB_OUTPUT"
          done
          echo "branch_available=$(jq -r --arg arch "$BUILD_ARCH" '(.availableBuildArches // []) | index($arch) != null' stock-source/source.json)" >> "$GITHUB_OUTPUT"

      - name: Download Shared Common Splits
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit != 'true' && steps.shared.outputs.available == 'true' && inputs.source_strategy != 'branches'
        uses: actions/download-artifact@v8
        with:
          name: source-${{ inputs.source_key }}-common
          path: stock-source/common

      - name: Download Shared ABI Splits
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit != 'true' && steps.shared.outputs.available == 'true' && steps.shared.outputs.branch_available == 'true' && inputs.source_strategy != 'branches' && inputs.arch != 'universal'
        uses: actions/download-artifact@v8
        with:
          name: source-${{ inputs.source_key }}-${{ inputs.arch }}
          path: stock-source/abi/${{ inputs.arch }}

      - name: Download Shared arm64-v8a Splits for Universal
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit != 'true' && steps.shared.outputs.available == 'true' && steps.shared.outputs.has_arm64_v8a == 'true' && inputs.source_strategy != 'branches' && inputs.arch == 'universal'
        uses: actions/download-artifact@v8
        with:
          name: source-${{ inputs.source_key }}-arm64-v8a
          path: stock-source/abi/arm64-v8a

      - name: Download Shared arm-v7a Splits for Universal
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit != 'true' && steps.shared.outputs.available == 'true' && steps.shared.outputs.has_arm_v7a == 'true' && inputs.source_strategy != 'branches' && inputs.arch == 'universal'
        uses: actions/download-artifact@v8
        with:
          name: source-${{ inputs.source_key }}-arm-v7a
          path: stock-source/abi/arm-v7a

      - name: Download Shared x86_64 Splits for Universal
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit != 'true' && steps.shared.outputs.available == 'true' && steps.shared.outputs.has_x86_64 == 'true' && inputs.source_strategy != 'branches' && inputs.arch == 'universal'
        uses: actions/download-artifact@v8
        with:
          name: source-${{ inputs.source_key }}-x86_64
          path: stock-source/abi/x86_64

      - name: Download Shared x86 Splits for Universal
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit != 'true' && steps.shared.outputs.available == 'true' && steps.shared.outputs.has_x86 == 'true' && inputs.source_strategy != 'branches' && inputs.arch == 'universal'
        uses: actions/download-artifact@v8
        with:
          name: source-${{ inputs.source_key }}-x86
          path: stock-source/abi/x86

      - name: Download Architecture Source Payload
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit != 'true' && steps.shared.outputs.available == 'true' && inputs.source_strategy == 'branches'
        uses: actions/download-artifact@v8
        with:
          name: source-${{ inputs.source_key }}-${{ inputs.arch }}
          path: stock-source/branch

      - name: Merge and Normalize Stock
        id: stock_build
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUILD_TARGET: ${{ inputs.target }}
          BUILD_ARCH: ${{ inputs.arch }}
          BUILD_MODE: apk
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_OPTIONAL_VARIANT: ${{ inputs.optional }}
          BUILD_STOCK_ONLY: "true"
          BUILD_STOCK_OUTPUT_DIR: stock-result
          BUILD_STOCK_SOURCE_DIR: stock-source
          BUILD_STOCK_OFFLINE: "true"
        run: scripts/capture-build-stage.sh stock-result/stock-stage.log ./build.sh config.toml

      - name: Write Stock Status
        id: stock_status
        if: steps.stock_need.outputs.needed == 'true'
        shell: bash
        env:
          STOCK_CACHE_HIT: ${{ steps.stock_cache.outputs.cache-hit }}
          STOCK_EXIT_CODE: ${{ steps.stock_build.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p stock-result
          status=failed
          outcome=failed
          reason=""
          category=""
          failure_class=""
          if [ "$STOCK_CACHE_HIT" = true ]; then
            status=ready
            outcome=cache-hit
          elif [ "${STOCK_EXIT_CODE:-1}" = 0 ] && [ -s stock-result/stock.apk ]; then
            status=ready
            outcome=success
          elif [ "${STOCK_EXIT_CODE:-1}" = 0 ] && [ -s stock-result/skip.json ]; then
            status=ready
            outcome=unavailable
            category=stock-unavailable
            failure_class=input
            reason=$(jq -r '.reason // "stock variant unavailable"' stock-result/skip.json)
          elif [ -n "${STOCK_EXIT_CODE:-}" ]; then
            category=stock-failed
            failure_class=tooling
            reason="stock stage exited ${STOCK_EXIT_CODE}"
          else
            category=stock-not-run
            failure_class=infrastructure
            reason="stock stage did not run"
          fi
          jq -n \
            --arg status "$status" \
            --arg outcome "$outcome" \
            --arg reason "$reason" \
            --arg category "$category" \
            --arg failureClass "$failure_class" \
            --arg target '${{ inputs.target }}' \
            --arg version '${{ inputs.version }}' \
            --arg arch '${{ inputs.arch }}' \
            '{schemaVersion:1,status:$status,outcome:$outcome,stage:"stock",reason:$reason,category:$category,failureClass:$failureClass,target:$target,version:$version,arch:$arch}' \
            > stock-result/status.json
          echo "ready=$([ "$status" = ready ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$status" != ready ]; then
            echo "Stock candidate was rejected; downstream patch candidates will record a failed handoff without running the patcher."
          fi

      - name: Summarize Stock
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.stock_need.outputs.needed }}' != true ]; then
            printf '## Stock · %s / %s / %s\n\nReused from an existing release input; no stock preparation was required.\n' '${{ inputs.target }}' '${{ inputs.version }}' '${{ inputs.arch }}' >> "$GITHUB_STEP_SUMMARY"
          elif [ -s stock-result/status.json ]; then
            args=(stock --status stock-result/status.json)
            [ ! -s stock-result/stock.json ] || args+=(--stock stock-result/stock.json)
            python scripts/ci_summary.py "${args[@]}"
          fi

      - name: Save Prepared Stock Cache
        if: steps.stock_need.outputs.needed == 'true' && steps.stock_cache.outputs.cache-hit != 'true' && steps.stock_status.outputs.ready == 'true' && steps.stock_build.outputs.exit_code == '0'
        uses: actions/cache/save@v6
        with:
          path: stock-result
          key: patched-kushion-stock-v2-${{ inputs.branch_key }}-${{ inputs.source_cache_key }}-${{ inputs.stock_policy_hash }}-${{ hashFiles('build.sh', 'utils.sh', 'scripts/stock_bundle.py', 'scripts/stock_fingerprint.py') }}

      - name: Upload Verified Stock
        if: steps.stock_need.outputs.needed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: stock-${{ inputs.branch_key }}
          path: stock-result/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0


  patch:
    name: Patch / ${{ inputs.target }} / ${{ inputs.arch }} / ${{ matrix.variant.mode }}
    needs: stock
    runs-on: ubuntu-24.04
    env:
      PATCHED_KUSHION_CACHE_DIR: ${{ github.workspace }}/.patched-kushion-cache
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - name: Check Out Source
        uses: actions/checkout@v6

      - name: Resolve Variant Input
        id: variant
        env:
          VARIANT_JSON: ${{ toJSON(matrix.variant) }}
          SELECTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          input_id=$(jq -r '.inputId // empty' <<<"$VARIANT_JSON")
          selected_version=$(jq -r '.selectedVersion // empty' <<<"$VARIANT_JSON")
          result_key=$(jq -r '.resultKey // empty' <<<"$VARIANT_JSON")
          test -n "$input_id" || { echo "Version fan-out did not provide an input identity" >&2; exit 1; }
          test "$selected_version" = "$SELECTED_VERSION" || { echo "Version fan-out selected '$selected_version', workflow received '$SELECTED_VERSION'" >&2; exit 1; }
          test -n "$result_key" || { echo "Version fan-out did not provide a result key" >&2; exit 1; }
          reuse=$(jq -r '(.reuse.inputId // "") != "" and (.reuse.inputId == .inputId)' <<<"$VARIANT_JSON")
          echo "input_id=$input_id" >> "$GITHUB_OUTPUT"
          echo "result_key=$result_key" >> "$GITHUB_OUTPUT"
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

      - name: Download Prepared Stock
        if: steps.variant.outputs.reuse != 'true'
        uses: actions/download-artifact@v8
        with:
          name: stock-${{ inputs.branch_key }}
          path: stock-input

      - name: Read Stock Status
        id: stock_status
        if: steps.variant.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s stock-input/status.json
          jq -e \
            --arg target '${{ inputs.target }}' \
            --arg version '${{ inputs.version }}' \
            --arg arch '${{ inputs.arch }}' \
            '.schemaVersion == 1 and .target == $target and .version == $version and .arch == $arch and (.status == "ready" or .status == "failed")' \
            stock-input/status.json >/dev/null
          status=$(jq -r .status stock-input/status.json)
          echo "ready=$([ "$status" = ready ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "$status" != ready ]; then
            echo "Stock stage rejected this candidate; patching is intentionally skipped."
          fi

      - name: Load APK Signing Identity
        if: steps.variant.outputs.reuse != 'true' && steps.stock_status.outputs.ready == 'true'
        env:
          APK_PATCHER_KEYSTORE_B64: ${{ secrets.APK_PATCHER_KEYSTORE_B64 }}
          APK_APKSIGNER_KEYSTORE_B64: ${{ secrets.APK_APKSIGNER_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APK_PATCHER_KEYSTORE_B64:?Set APK_PATCHER_KEYSTORE_B64}"
          : "${APK_APKSIGNER_KEYSTORE_B64:?Set APK_APKSIGNER_KEYSTORE_B64}"
          mkdir -p signing/package
          printf '%s' "$APK_PATCHER_KEYSTORE_B64" | base64 --decode > signing/package/package.keystore
          printf '%s' "$APK_APKSIGNER_KEYSTORE_B64" | base64 --decode > signing/package/package.p12
          chmod 600 signing/package/package.keystore signing/package/package.p12

      - name: Resolve Patch Cache Identity
        id: patch_identity
        if: steps.variant.outputs.reuse != 'true' && steps.stock_status.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -s stock-input/skip.json ]; then
            actual="SKIP-$(sha256sum stock-input/skip.json | awk '{print toupper($1)}')"
          else
            stock_sha=$(jq -r '.sha256 // empty' stock-input/stock.json)
            test -n "$stock_sha" || { echo >&2 "Prepared stock metadata has no SHA-256"; exit 1; }
            actual=$(sha256sum stock-input/stock.apk | awk '{print toupper($1)}')
            test "${stock_sha^^}" = "$actual" || { echo >&2 "Prepared stock SHA-256 changed before patching"; exit 1; }
          fi
          signing_sha=$(sha256sum signing/package/package.p12 | awk '{print toupper($1)}')
          test -n "$signing_sha" || { echo >&2 "Could not fingerprint patch signing identity"; exit 1; }
          echo "stock_sha=$actual" >> "$GITHUB_OUTPUT"
          echo "signing_sha=$signing_sha" >> "$GITHUB_OUTPUT"

      - name: Restore Patch Result Cache
        id: patch_cache
        if: steps.variant.outputs.reuse != 'true' && steps.stock_status.outputs.ready == 'true' && inputs.force_build != true
        uses: actions/cache/restore@v6
        with:
          path: patch-result
          key: patched-kushion-patch-v2-${{ steps.variant.outputs.input_id }}-${{ steps.patch_identity.outputs.stock_sha }}-${{ steps.patch_identity.outputs.signing_sha }}

      - name: Validate Patch Result Cache
        if: steps.variant.outputs.reuse != 'true' && steps.stock_status.outputs.ready == 'true' && steps.patch_cache.outputs.cache-hit == 'true'
        shell: bash
        run: scripts/cache_handoff.py patch --root patch-result --target '${{ inputs.target }}' --version '${{ inputs.version }}' --arch '${{ inputs.arch }}' --mode '${{ matrix.variant.mode }}' --profile '${{ matrix.variant.patchProfileHash }}'

      - name: Set Up Locked Toolchain
        if: steps.variant.outputs.reuse != 'true' && steps.stock_status.outputs.ready == 'true' && (inputs.force_build == true || steps.patch_cache.outputs.cache-hit != 'true')
        uses: ./.github/actions/setup-toolchain

      - name: Restore Patch Prebuilt Cache
        if: steps.variant.outputs.reuse != 'true' && steps.stock_status.outputs.ready == 'true' && (inputs.force_build == true || steps.patch_cache.outputs.cache-hit != 'true')
        uses: actions/cache@v6
        with:
          path: ${{ env.PATCHED_KUSHION_CACHE_DIR }}/patches
          key: patched-kushion-patches-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant.patchAssetHash }}

      - name: Select Android Build Tools
        if: steps.variant.outputs.reuse != 'true' && steps.stock_status.outputs.ready == 'true' && (inputs.force_build == true || steps.patch_cache.outputs.cache-hit != 'true')
        shell: bash
        run: pixi run android-tools

      - name: Apply Patches
        id: patch_apply
        if: steps.variant.outputs.reuse != 'true' && steps.stock_status.outputs.ready == 'true' && (inputs.force_build == true || steps.patch_cache.outputs.cache-hit != 'true')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ inputs.release_tag }}
          BUILD_TARGET: ${{ inputs.target }}
          BUILD_ARCH: ${{ inputs.arch }}
          BUILD_MODE: ${{ matrix.variant.mode }}
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_OPTIONAL_VARIANT: ${{ matrix.variant.optional }}
          BUILD_PATCH_PROFILE_HASH: ${{ matrix.variant.patchProfileHash }}
          BUILD_STOCK_DIR: stock-input
          BUILD_PATCH_ONLY: "true"
          BUILD_PATCH_OUTPUT_DIR: patch-result
          APK_PATCHER_KEYSTORE: signing/package/package.keystore
          APK_APKSIGNER_KEYSTORE: signing/package/package.p12
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_SIGNER_NAME: ${{ secrets.APK_SIGNER_NAME }}
        run: scripts/capture-build-stage.sh patch-result/patch-stage.log ./build.sh config.toml

      - name: Remove Signing Files
        if: always()
        run: rm -rf signing

      - name: Write Patch Status
        id: patch_status
        if: ${{ always() && steps.variant.outputs.reuse != 'true' }}
        env:
          STOCK_READY: ${{ steps.stock_status.outputs.ready }}
          PATCH_EXIT_CODE: ${{ steps.patch_apply.outputs.exit_code }}
          PATCH_CACHE_HIT: ${{ steps.patch_cache.outputs.cache-hit }}
          PATCH_COMPATIBILITY: ${{ matrix.variant.compatibility }}
          PATCH_TRAVERSAL_INDEX: ${{ matrix.variant.traversalIndex }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patch-result
          status=failed
          outcome=failed
          reason=""
          category=""
          failure_class=""
          failure_stage=patch
          diagnostics='{}'
          if [ "$STOCK_READY" != true ]; then
            failure_stage=stock
            reason=$(jq -r '.reason // "stock stage failed"' stock-input/status.json 2>/dev/null || echo 'stock stage failed')
            category=$(jq -r '.category // "stock-failed"' stock-input/status.json 2>/dev/null || echo 'stock-failed')
            failure_class=$(jq -r '.failureClass // "input"' stock-input/status.json 2>/dev/null || echo input)
            diagnostics=$(jq -c '.diagnostics // {}' stock-input/status.json 2>/dev/null || echo '{}')
          elif [ "$PATCH_CACHE_HIT" = true ]; then
            status=ready
            outcome=cache-hit
          elif [ "${PATCH_EXIT_CODE:-1}" = 0 ]; then
            status=ready
            outcome=success
          elif [ -n "${PATCH_EXIT_CODE:-}" ]; then
            python scripts/build_diagnostics.py patch \
              --log patch-result/patch-stage.log \
              --exit-code "$PATCH_EXIT_CODE" \
              --json patch-result/failure-diagnostics.json >/dev/null
            diagnostics=$(cat patch-result/failure-diagnostics.json)
            reason=$(jq -r '.reason // "patch stage failed"' patch-result/failure-diagnostics.json)
            category=$(jq -r '.category // "patch-failed"' patch-result/failure-diagnostics.json)
            failure_class=$(jq -r '.failureClass // "unknown"' patch-result/failure-diagnostics.json)
          else
            reason="patch stage did not run"
            category=patch-not-run
            failure_class=infrastructure
          fi
          jq -n \
            --arg status "$status" \
            --arg outcome "$outcome" \
            --arg reason "$reason" \
            --arg category "$category" \
            --arg failureClass "$failure_class" \
            --arg stage "$failure_stage" \
            --arg target '${{ inputs.target }}' \
            --arg version '${{ inputs.version }}' \
            --arg arch '${{ inputs.arch }}' \
            --arg mode '${{ matrix.variant.mode }}' \
            --arg key '${{ matrix.variant.resultKey }}' \
            --arg variantKey '${{ matrix.variant.key }}' \
            --arg compatibility "$PATCH_COMPATIBILITY" \
            --argjson traversalIndex "${PATCH_TRAVERSAL_INDEX:-0}" \
            --argjson diagnostics "$diagnostics" \
            '{schemaVersion:1,status:$status,outcome:$outcome,stage:$stage,reason:$reason,category:$category,failureClass:$failureClass,target:$target,version:$version,arch:$arch,mode:$mode,key:$key,variantKey:$variantKey,compatibility:$compatibility,traversalIndex:$traversalIndex,diagnostics:$diagnostics}' \
            > patch-result/status.json

      - name: Summarize Patch
        if: always()
        shell: bash
        run: |
          if [ '${{ steps.variant.outputs.reuse }}' = true ]; then
            printf '## Patch · %s / %s / %s / %s\n\nReused from an existing release input; patching was not required.\n' '${{ inputs.target }}' '${{ inputs.version }}' '${{ inputs.arch }}' '${{ matrix.variant.mode }}' >> "$GITHUB_STEP_SUMMARY"
          elif [ -s patch-result/status.json ]; then
            python scripts/ci_summary.py patch --status patch-result/status.json
          fi

      - name: Save Patch Result Cache
        if: steps.variant.outputs.reuse != 'true' && inputs.force_build != true && steps.patch_cache.outputs.cache-hit != 'true' && steps.patch_apply.outputs.exit_code == '0'
        uses: actions/cache/save@v6
        with:
          path: patch-result
          key: patched-kushion-patch-v2-${{ steps.variant.outputs.input_id }}-${{ steps.patch_identity.outputs.stock_sha }}-${{ steps.patch_identity.outputs.signing_sha }}

      - name: Upload Patch Handoff
        if: ${{ always() && steps.variant.outputs.reuse != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: patch-${{ matrix.variant.resultKey }}
          path: patch-result/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Report Rejected Patch Candidate
        if: ${{ always() && steps.variant.outputs.reuse != 'true' && steps.patch_status.outputs.ready != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          category=$(jq -r '.category // "patch-failed"' patch-result/status.json)
          failure_class=$(jq -r '.failureClass // "unknown"' patch-result/status.json)
          reason=$(jq -r '.reason // "patch candidate failed"' patch-result/status.json)
          echo "Patch candidate ${{ matrix.variant.resultKey }} was rejected: category=$category class=$failure_class reason=$reason"
          echo "Publication health is evaluated once after all candidates finish."

  package:
    name: Package / ${{ inputs.target }} / ${{ inputs.arch }} / ${{ matrix.variant.mode }}
    needs: [stock, patch]
    if: ${{ always() && needs.stock.result == 'success' && needs.patch.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      PATCHED_KUSHION_CACHE_DIR: ${{ github.workspace }}/.patched-kushion-cache
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - name: Check Out Source
        uses: actions/checkout@v6

      - name: Resolve Variant Input
        id: variant
        env:
          VARIANT_JSON: ${{ toJSON(matrix.variant) }}
          SELECTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          input_id=$(jq -r '.inputId // empty' <<<"$VARIANT_JSON")
          selected_version=$(jq -r '.selectedVersion // empty' <<<"$VARIANT_JSON")
          result_key=$(jq -r '.resultKey // empty' <<<"$VARIANT_JSON")
          test -n "$input_id" || { echo "Version fan-out did not provide an input identity" >&2; exit 1; }
          test "$selected_version" = "$SELECTED_VERSION" || { echo "Version fan-out selected '$selected_version', workflow received '$SELECTED_VERSION'" >&2; exit 1; }
          test -n "$result_key" || { echo "Version fan-out did not provide a result key" >&2; exit 1; }
          reuse=$(jq -r '(.reuse.inputId // "") != "" and (.reuse.inputId == .inputId)' <<<"$VARIANT_JSON")
          echo "input_id=$input_id" >> "$GITHUB_OUTPUT"
          echo "result_key=$result_key" >> "$GITHUB_OUTPUT"
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

      - name: Download Patch Handoff
        if: steps.variant.outputs.reuse != 'true'
        uses: actions/download-artifact@v8
        with:
          name: patch-${{ matrix.variant.resultKey }}
          path: patch-input

      - name: Read Patch Status
        id: patch_status
        if: steps.variant.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s patch-input/status.json
          jq -e \
            --arg target '${{ inputs.target }}' \
            --arg version '${{ inputs.version }}' \
            --arg arch '${{ inputs.arch }}' \
            --arg mode '${{ matrix.variant.mode }}' \
            --arg key '${{ matrix.variant.resultKey }}' \
            --arg variantKey '${{ matrix.variant.key }}' \
            '.schemaVersion == 1 and .target == $target and .version == $version and .arch == $arch and .mode == $mode and .key == $key and (.variantKey // $variantKey) == $variantKey and (.status == "ready" or .status == "failed")' \
            patch-input/status.json >/dev/null
          status=$(jq -r .status patch-input/status.json)
          if [ "$status" = ready ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Patch stage rejected this variant; packaging is intentionally skipped."
          fi

      - name: Set Up Locked Toolchain
        if: steps.variant.outputs.reuse != 'true' && steps.patch_status.outputs.ready == 'true'
        uses: ./.github/actions/setup-toolchain

      - name: Restore Verified Helper Cache
        if: steps.variant.outputs.reuse != 'true' && steps.patch_status.outputs.ready == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.PATCHED_KUSHION_CACHE_DIR }}/tools
          key: patched-kushion-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('utils.sh') }}
          restore-keys: |
            patched-kushion-tools-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Select Android Build Tools
        if: steps.variant.outputs.reuse != 'true' && steps.patch_status.outputs.ready == 'true'
        shell: bash
        run: pixi run android-tools

      - name: Download Prepared Stock
        if: steps.variant.outputs.reuse != 'true' && steps.patch_status.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: stock-${{ inputs.branch_key }}
          path: stock-input

      - name: Load APK Signing Identity
        if: steps.variant.outputs.reuse != 'true' && steps.patch_status.outputs.ready == 'true'
        env:
          APK_PATCHER_KEYSTORE_B64: ${{ secrets.APK_PATCHER_KEYSTORE_B64 }}
          APK_APKSIGNER_KEYSTORE_B64: ${{ secrets.APK_APKSIGNER_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APK_PATCHER_KEYSTORE_B64:?Set APK_PATCHER_KEYSTORE_B64}"
          : "${APK_APKSIGNER_KEYSTORE_B64:?Set APK_APKSIGNER_KEYSTORE_B64}"
          mkdir -p signing/package
          printf '%s' "$APK_PATCHER_KEYSTORE_B64" | base64 --decode > signing/package/package.keystore
          printf '%s' "$APK_APKSIGNER_KEYSTORE_B64" | base64 --decode > signing/package/package.p12
          chmod 600 signing/package/package.keystore signing/package/package.p12

      - name: Finalize and Package
        if: steps.variant.outputs.reuse != 'true' && steps.patch_status.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ inputs.release_tag }}
          BUILD_TARGET: ${{ inputs.target }}
          BUILD_ARCH: ${{ inputs.arch }}
          BUILD_MODE: ${{ matrix.variant.mode }}
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_OPTIONAL_VARIANT: ${{ matrix.variant.optional }}
          BUILD_PATCH_PROFILE_HASH: ${{ matrix.variant.patchProfileHash }}
          BUILD_STOCK_DIR: stock-input
          BUILD_PATCH_DIR: patch-input
          BUILD_PACKAGE_ONLY: "true"
          APK_PATCHER_KEYSTORE: signing/package/package.keystore
          APK_APKSIGNER_KEYSTORE: signing/package/package.p12
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_SIGNER_NAME: ${{ secrets.APK_SIGNER_NAME }}
        run: ./build.sh config.toml

      - name: Save Reused Build Result
        if: steps.variant.outputs.reuse == 'true'
        env:
          VARIANT_JSON: ${{ toJSON(matrix.variant) }}
        run: |
          scripts/write-reuse-result.py \
            --variant-json "$VARIANT_JSON" \
            --version '${{ inputs.version }}' \
            --target '${{ inputs.target }}' \
            --arch '${{ inputs.arch }}' \
            --output-dir build-result

      - name: Save Build Result
        if: steps.variant.outputs.reuse != 'true' && steps.patch_status.outputs.ready == 'true'
        run: |
          scripts/write-build-result.py \
            --key '${{ matrix.variant.resultKey }}' \
            --variant-key '${{ matrix.variant.key }}' \
            --input-id '${{ steps.variant.outputs.input_id }}' \
            --target '${{ inputs.target }}' \
            --arch '${{ inputs.arch }}' \
            --mode '${{ matrix.variant.mode }}' \
            --version '${{ inputs.version }}' \
            --output-dir build-result

      - name: Save Failed Build Result
        if: steps.variant.outputs.reuse != 'true' && steps.patch_status.outputs.ready != 'true'
        env:
          VARIANT_JSON: ${{ toJSON(matrix.variant) }}
        run: |
          scripts/write-variant-failure.py \
            --variant-json "$VARIANT_JSON" \
            --version '${{ inputs.version }}' \
            --target '${{ inputs.target }}' \
            --arch '${{ inputs.arch }}' \
            --status-file patch-input/status.json \
            --output-dir build-result

      - name: Summarize Variant Result
        if: always() && hashFiles('build-result/result.json') != ''
        run: python scripts/ci_summary.py variant --result build-result/result.json

      - name: Remove Signing Files
        if: always()
        run: rm -rf signing

      - name: Upload Build Result
        if: always() && hashFiles('build-result/result.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: variant-${{ matrix.variant.resultKey }}
          path: build-result/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload Result Metadata
        if: always() && hashFiles('build-result/result.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.variant.resultKey }}
          path: build-result/result.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 9
