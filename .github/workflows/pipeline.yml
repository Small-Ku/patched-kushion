name: Update

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Build all configured variants, including current variants
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 16 * * *"

concurrency:
  group: patched-kushion-update-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      generation: ${{ steps.plan.outputs.generation }}
    steps:
      - name: Check Out Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load Build State
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/build-state.json"
          if git fetch --no-tags --depth=1 origin update \
            && git show FETCH_HEAD:build-state.json > "$state"; then
            echo "Loaded build state from update branch"
          else
            printf '%s\n' '{"schemaVersion":1,"variants":{}}' > "$state"
            echo "No build state exists yet"
          fi

      - name: Create Build Plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
        shell: bash
        run: |
          set -euo pipefail
          force=()
          [ "$FORCE_BUILD" = true ] && force=(--force)
          matrix=$(scripts/pipeline_plan.py \
            --state "$RUNNER_TEMP/build-state.json" \
            --output "$RUNNER_TEMP/build-plan.json" \
            --repository "$GITHUB_REPOSITORY" \
            "${force[@]}")
          count=$(jq '.include | length' <<<"$matrix")
          release_tag=$(jq -r .releaseTag "$RUNNER_TEMP/build-plan.json")
          generation=$(jq -r .generation "$RUNNER_TEMP/build-plan.json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_builds=$([ "$count" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          jq '{releaseTag,generation,matrix}' "$RUNNER_TEMP/build-plan.json"

      - name: Upload Build Plan
        uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: |
            ${{ runner.temp }}/build-plan.json
            ${{ runner.temp }}/build-state.json
          retention-days: 2

  build:
    name: Build ${{ matrix.target }} / ${{ matrix.arch }} / ${{ matrix.mode }}
    needs: plan
    if: needs.plan.outputs.has_builds == '1'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      mode: ${{ matrix.mode }}
      version: ${{ matrix.version }}
      variant_key: ${{ matrix.key }}
      input_id: ${{ matrix.inputId }}
      release_tag: ${{ needs.plan.outputs.release_tag }}
    secrets: inherit

  release:
    name: Publish Release
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check Out Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Build Plan
        uses: actions/download-artifact@v4
        with:
          name: build-plan
          path: ${{ runner.temp }}/plan

      - name: Download Build Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: variant-*
          path: ${{ runner.temp }}/variants

      - name: Publish Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/publish_release.py \
            --plan "$RUNNER_TEMP/plan/build-plan.json" \
            --state "$RUNNER_TEMP/plan/build-state.json" \
            --artifacts "$RUNNER_TEMP/variants" \
            --output-dir "$RUNNER_TEMP/published"

      - name: Save Build State
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/published/build-state.json" || {
            echo "No release update exists. Keep the current build state."
            exit 0
          }
          worktree="$RUNNER_TEMP/update-state"
          if git ls-remote --exit-code --heads origin update >/dev/null 2>&1; then
            git fetch origin update
            git worktree add --detach "$worktree" origin/update
            git -C "$worktree" switch -C update
          else
            git worktree add --detach "$worktree" HEAD
            git -C "$worktree" switch --orphan update
            git -C "$worktree" rm -rf . || true
          fi
          cp "$RUNNER_TEMP/published/build-state.json" "$worktree/build-state.json"
          cp "$RUNNER_TEMP/published/build.md" "$worktree/build.md"
          rm -f "$worktree"/*-update.json
          cp "$RUNNER_TEMP/published"/*-update.json "$worktree"/ 2>/dev/null || true
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add -A
          if git -C "$worktree" diff --cached --quiet; then
            echo "Build state is current"
          else
            git -C "$worktree" commit -m "Update build state ${{ needs.plan.outputs.release_tag }}"
            git -C "$worktree" push origin HEAD:update
          fi

  check_fdroid:
    name: Check F-Droid
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check Out Source
        uses: actions/checkout@v6

      - name: Load F-Droid State
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          provenance="$RUNNER_TEMP/fdroid-provenance.json"
          if git fetch --no-tags --depth=1 origin fdroid \
            && git show FETCH_HEAD:fdroid/provenance.json > "$provenance"; then
            echo "Loaded F-Droid provenance"
          else
            rm -f "$provenance"
          fi
          echo "path=$provenance" >> "$GITHUB_OUTPUT"

      - name: Check F-Droid State
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/fdroid-check.log"
          python3 scripts/fdroid_sources.py check \
            --config fdroid/sources.toml \
            --provenance '${{ steps.provenance.outputs.path }}' | tee "$log"
          changed=$(sed -n 's/^changed=\([01]\)$/\1/p' "$log" | tail -1)
          case "$changed" in
            0|1) echo "changed=$changed" >> "$GITHUB_OUTPUT" ;;
            *) echo "F-Droid state check returned an invalid result" >&2; exit 1 ;;
          esac

  fdroid:
    name: Publish F-Droid
    needs: check_fdroid
    if: needs.check_fdroid.outputs.changed == '1'
    permissions:
      contents: write
    uses: ./.github/workflows/fdroid.yml
    secrets: inherit
