name: Update

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Build all configured variants, including current variants
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 16 * * *"

concurrency:
  group: patched-kushion-update-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      generation: ${{ steps.plan.outputs.generation }}
    steps:
      - name: Check Out Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set Up Locked Toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Load Build State
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/build-state.json"
          if gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/build-state.json?ref=update" > "$state" 2>/dev/null; then
            echo "Loaded build state from update branch without fetching the branch"
          else
            printf '%s\n' '{"schemaVersion":1,"variants":{}}' > "$state"
            echo "No build state exists yet"
          fi

      - name: Create Build Plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
        shell: bash
        run: |
          set -euo pipefail
          force=()
          [ "$FORCE_BUILD" = true ] && force=(--force)
          matrix=$(scripts/pipeline_plan.py \
            --state "$RUNNER_TEMP/build-state.json" \
            --output "$RUNNER_TEMP/build-plan.json" \
            --repository "$GITHUB_REPOSITORY" \
            "${force[@]}")
          count=$(jq '.include | length' <<<"$matrix")
          release_tag=$(jq -r .releaseTag "$RUNNER_TEMP/build-plan.json")
          generation=$(jq -r .generation "$RUNNER_TEMP/build-plan.json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_builds=$([ "$count" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          jq '{releaseTag,generation,matrix}' "$RUNNER_TEMP/build-plan.json"

      - name: Summarize Build Plan
        run: python scripts/ci_summary.py plan --plan "$RUNNER_TEMP/build-plan.json"

      - name: Upload Build Plan
        uses: actions/upload-artifact@v7
        with:
          name: variant-build-plan
          path: |
            ${{ runner.temp }}/build-plan.json
            ${{ runner.temp }}/build-state.json
          retention-days: 2

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.has_builds == '1'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      target: ${{ matrix.target }}
      version: ${{ matrix.version }}
      versions: ${{ toJSON(matrix.versions) }}
      target_key: ${{ matrix.key }}
      arches: ${{ toJSON(matrix.arches) }}
      release_tag: ${{ needs.plan.outputs.release_tag }}
      forward_compatibility_probes: ${{ matrix.forwardProbeLimit }}
      force_build: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
    secrets: inherit

  release:
    name: Publish Release
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      pending_count: ${{ steps.publication.outputs.pending_count }}
      complete: ${{ steps.publication.outputs.complete }}
    steps:
      - name: Check Out Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set Up Locked Toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Download Build Plan
        uses: actions/download-artifact@v8
        with:
          name: variant-build-plan
          path: ${{ runner.temp }}/plan

      - name: Download Build Results
        uses: actions/download-artifact@v8
        with:
          pattern: variant-*
          path: ${{ runner.temp }}/variants

      - name: Publish Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/publish_release.py \
            --plan "$RUNNER_TEMP/plan/build-plan.json" \
            --state "$RUNNER_TEMP/plan/build-state.json" \
            --artifacts "$RUNNER_TEMP/variants" \
            --output-dir "$RUNNER_TEMP/published"

      - name: Read Publication Status
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/published/publication-status.json"
          test -s "$status"
          jq -e '.schemaVersion == 1 and (.pending | type == "array") and (.complete | type == "boolean")' "$status" >/dev/null
          pending_count=$(jq '.pending | length' "$status")
          complete=$(jq -r .complete "$status")
          echo "pending_count=$pending_count" >> "$GITHUB_OUTPUT"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "Publication status: pending=$pending_count complete=$complete"
          if [ "$pending_count" -gt 0 ]; then
            jq -r '.pendingDetails[]? | "  pending: " + (.target // "") + " / " + (.version // "") + " / " + (.arch // "") + " / " + (.mode // "") + " — " + (.reason // .category // "unknown")' "$status"
          fi

      - name: Summarize Release Publication
        run: |
          python scripts/ci_summary.py release \
            --plan "$RUNNER_TEMP/plan/build-plan.json" \
            --status "$RUNNER_TEMP/published/publication-status.json" \
            --assets "$RUNNER_TEMP/published/published-assets.json"

      - name: Upload Release Publication Handoff
        uses: actions/upload-artifact@v7
        with:
          name: release-publication
          path: |
            ${{ runner.temp }}/published/publication-status.json
            ${{ runner.temp }}/published/published-assets.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 9

      - name: Save Build State
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/published/build-state.json" || {
            echo "No release update exists. Keep the current build state."
            exit 0
          }
          worktree="$RUNNER_TEMP/update-state"
          if git ls-remote --exit-code --heads origin update >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin update
            git worktree add --detach "$worktree" FETCH_HEAD
            git -C "$worktree" switch -C update
          else
            git worktree add --detach "$worktree" HEAD
            git -C "$worktree" switch --orphan update
            git -C "$worktree" rm -rf . || true
          fi
          cp "$RUNNER_TEMP/published/build-state.json" "$worktree/build-state.json"
          cp "$RUNNER_TEMP/published/build.md" "$worktree/build.md"
          rm -f "$worktree"/*-update.json
          cp "$RUNNER_TEMP/published"/*-update.json "$worktree"/ 2>/dev/null || true
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add -A
          if git -C "$worktree" diff --cached --quiet; then
            echo "Build state is current"
          else
            git -C "$worktree" commit -m "Update build state ${{ needs.plan.outputs.release_tag }}"
            git -C "$worktree" push origin HEAD:update
          fi

  check_fdroid:
    name: Check F-Droid
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      built_changed: ${{ steps.check.outputs.built_changed }}
      source_changed: ${{ steps.check.outputs.source_changed }}
    steps:
      - name: Check Out Source
        uses: actions/checkout@v6

      - name: Set Up Locked Toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Download Release Publication Handoff
        uses: actions/download-artifact@v8
        with:
          name: release-publication
          path: ${{ runner.temp }}/release-publication

      - name: Load F-Droid State
        id: provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          provenance="$RUNNER_TEMP/fdroid-provenance.json"
          if gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/fdroid/provenance.json?ref=fdroid" > "$provenance" 2>/dev/null; then
            echo "Loaded F-Droid provenance without fetching the branch"
          else
            rm -f "$provenance"
          fi
          echo "path=$provenance" >> "$GITHUB_OUTPUT"

      - name: Check F-Droid State
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          built_log="$RUNNER_TEMP/fdroid-built-gate.log"
          source_log="$RUNNER_TEMP/fdroid-source-check.log"

          python3 scripts/fdroid_release_gate.py \
            --config config.toml \
            --publication "$RUNNER_TEMP/release-publication/published-assets.json" | tee "$built_log"
          built_changed=$(sed -n 's/^changed=\([01]\)$/\1/p' "$built_log" | tail -1)

          python3 scripts/fdroid_sources.py check \
            --config config.toml \
            --provenance '${{ steps.provenance.outputs.path }}' | tee "$source_log"
          source_changed=$(sed -n 's/^changed=\([01]\)$/\1/p' "$source_log" | tail -1)

          case "$built_changed:$source_changed" in
            0:0) changed=0 ;;
            0:1|1:0|1:1) changed=1 ;;
            *) echo "F-Droid state check returned an invalid result" >&2; exit 1 ;;
          esac
          echo "Built-release trigger=$built_changed API/provenance trigger=$source_changed => changed=$changed"
          echo "built_changed=$built_changed" >> "$GITHUB_OUTPUT"
          echo "source_changed=$source_changed" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          {
            echo "## F-Droid change detection"
            echo
            echo "| Signal | Changed |"
            echo "| --- | --- |"
            echo "| Current-run release handoff | \`$built_changed\` |"
            echo "| Release/API provenance comparison | \`$source_changed\` |"
            echo "| Publish F-Droid | \`$changed\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  fdroid:
    name: Publish F-Droid
    needs: check_fdroid
    if: needs.check_fdroid.outputs.changed == '1'
    permissions:
      contents: write
    uses: ./.github/workflows/fdroid.yml
    with:
      publication_artifact: release-publication
    secrets: inherit
  health:
    name: Pipeline Health
    needs: [plan, build, release, check_fdroid, fdroid]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check Out Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download Build Plan
        if: needs.plan.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: variant-build-plan
          path: ${{ runner.temp }}/summary/plan

      - name: Download Source Metadata
        if: needs.plan.result == 'success' && needs.plan.outputs.has_builds == '1'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: summary-source-*
          path: ${{ runner.temp }}/summary/sources

      - name: Download Variant Result Metadata
        if: needs.plan.result == 'success' && needs.plan.outputs.has_builds == '1'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: ${{ runner.temp }}/summary/results

      - name: Download Release Publication Handoff
        if: needs.release.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: release-publication
          path: ${{ runner.temp }}/summary/release

      - name: Download F-Droid Publication Summary
        if: needs.fdroid.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: fdroid-publication-summary
          path: ${{ runner.temp }}/summary/fdroid

      - name: Render Pipeline Summary
        if: always()
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          FDROID_CHECK_RESULT: ${{ needs.check_fdroid.result }}
          FDROID_RESULT: ${{ needs.fdroid.result }}
          FDROID_CHANGED: ${{ needs.check_fdroid.outputs.changed }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/summary"
          plan="$RUNNER_TEMP/summary/plan/build-plan.json"
          if [ ! -s "$plan" ]; then
            printf '%s\n' '{"schemaVersion":1,"desired":[],"matrix":[],"availability":[]}' > "$plan"
          fi
          args=(
            pipeline
            --plan "$plan"
            --source-root "$RUNNER_TEMP/summary/sources"
            --result-root "$RUNNER_TEMP/summary/results"
            --publication-status "$RUNNER_TEMP/summary/release/publication-status.json"
            --published-assets "$RUNNER_TEMP/summary/release/published-assets.json"
            --fdroid-summary "$RUNNER_TEMP/summary/fdroid/fdroid-summary.json"
            --plan-result "$PLAN_RESULT"
            --build-result "$BUILD_RESULT"
            --release-result "$RELEASE_RESULT"
            --fdroid-check-result "$FDROID_CHECK_RESULT"
            --fdroid-result "$FDROID_RESULT"
            --fdroid-changed "${FDROID_CHANGED:-unknown}"
            --json "$RUNNER_TEMP/summary/pipeline-summary.json"
            --markdown "$RUNNER_TEMP/summary/pipeline-summary.md"
          )
          /usr/bin/python3 scripts/ci_summary.py "${args[@]}"

      - name: Upload Pipeline Summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-summary
          path: |
            ${{ runner.temp }}/summary/pipeline-summary.json
            ${{ runner.temp }}/summary/pipeline-summary.md
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

      - name: Evaluate Final Publication Health
        if: always()
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          FDROID_CHECK_RESULT: ${{ needs.check_fdroid.result }}
          FDROID_RESULT: ${{ needs.fdroid.result }}
          PENDING_COUNT: ${{ needs.release.outputs.pending_count }}
        run: |
          set -euo pipefail
          failed=0
          if [ "$PLAN_RESULT" != success ]; then
            echo >&2 "Build planning failed ($PLAN_RESULT)."
            failed=1
          fi
          if [ "$BUILD_RESULT" != success ] && [ "$BUILD_RESULT" != skipped ]; then
            echo >&2 "Build matrix infrastructure failed ($BUILD_RESULT)."
            failed=1
          fi
          if [ "$RELEASE_RESULT" != success ]; then
            echo >&2 "Release publication failed ($RELEASE_RESULT)."
            failed=1
          fi
          if [ "$FDROID_CHECK_RESULT" != success ] && [ "$FDROID_CHECK_RESULT" != skipped ]; then
            echo >&2 "F-Droid change detection failed ($FDROID_CHECK_RESULT)."
            failed=1
          fi
          if [ "$FDROID_RESULT" != success ] && [ "$FDROID_RESULT" != skipped ]; then
            echo >&2 "F-Droid publication failed ($FDROID_RESULT)."
            failed=1
          fi
          pending=${PENDING_COUNT:-0}
          if [[ ! $pending =~ ^[0-9]+$ ]]; then
            echo >&2 "Publication health returned an invalid pending count: $pending"
            failed=1
          elif [ "$pending" -gt 0 ]; then
            status="$RUNNER_TEMP/summary/release/publication-status.json"
            echo >&2 "$pending required publication variant(s) remain pending after all source/version candidates were evaluated."
            if [ -s "$status" ]; then
              jq -r '.pendingDetails[]? | "  - " + (.target // "") + " / " + (.version // "") + " / " + (.arch // "") + " / " + (.mode // "") + ": " + (.reason // .category // "unknown")' "$status" >&2
            fi
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "Pipeline publication health is complete."
